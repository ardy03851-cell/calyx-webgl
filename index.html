<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Explorer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; touch-action:none;
    -webkit-user-select:none; user-select:none; font-family:'Segoe UI',sans-serif; }
  #gameCanvas { position:fixed; inset:0; display:block; }

  /* ---------- UI ---------- */
  #hud { position:fixed; top:14px; left:14px; color:#dff4ff; z-index:10; pointer-events:none;
    text-shadow:0 1px 4px rgba(0,0,0,.6); }
  #hud h1 { font-size:18px; font-weight:600; letter-spacing:2px; opacity:.9; }
  #hud p  { font-size:12px; opacity:.7; margin-top:2px; }

  #modeBtn { position:fixed; top:14px; right:14px; z-index:10;
    background:rgba(10,40,60,.55); color:#dff4ff; border:1px solid rgba(160,220,255,.4);
    border-radius:14px; padding:12px 18px; font-size:15px; backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px); cursor:pointer; }
  #modeBtn:active { background:rgba(40,110,150,.7); }

  /* virtual joystick */
  #joy { position:fixed; bottom:36px; left:36px; width:130px; height:130px; z-index:10;
    border-radius:50%; background:rgba(120,200,255,.12); border:2px solid rgba(160,220,255,.35);
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
  #stick { position:absolute; left:50%; top:50%; width:56px; height:56px; border-radius:50%;
    background:rgba(180,230,255,.45); transform:translate(-50%,-50%); box-shadow:0 0 12px rgba(120,200,255,.5); }

  #hint { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); color:#cfeaff;
    font-size:11px; opacity:.55; z-index:10; pointer-events:none; text-align:center; }

  #title { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:radial-gradient(ellipse at center, rgba(4,30,50,.85), rgba(0,5,12,.97));
    color:#dff4ff; transition:opacity 1s; }
  #title h1 { font-size:clamp(30px,7vw,64px); letter-spacing:8px; font-weight:200; }
  #title p  { margin:14px 0 30px; opacity:.6; letter-spacing:2px; font-size:13px; }
  #playBtn { background:none; border:1px solid rgba(160,220,255,.6); color:#dff4ff;
    padding:16px 52px; font-size:17px; letter-spacing:4px; border-radius:30px; cursor:pointer; }
  #playBtn:active { background:rgba(120,200,255,.2); }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="hud"><h1>OCEAN EXPLORER</h1><p id="coord">0° N · 0° E</p></div>
<button id="modeBtn">🚤 Boat</button>
<div id="joy"><div id="stick"></div></div>
<div id="hint">Left stick: move · drag right side: look around</div>

<div id="title">
  <h1>OCEAN EXPLORER</h1>
  <p>AN ENDLESS SEA AWAITS</p>
  <button id="playBtn">SET SAIL</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="particles.js"></script>
<script src="models/boat.js"></script>
<script src="models/island.js"></script>
<script src="models/fish.js"></script>
<script src="models/buoy.js"></script>
<script>
/* ============================================================
   OCEAN EXPLORER — main engine
   Infinite procedural ocean · boat + swim modes · iPad touch
   ============================================================ */
'use strict';

// ---------- renderer / scene ----------
const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x9db8c8, 0.0016);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 4000);

// ---------- sky (gradient dome + sun) ----------
const skyGeo = new THREE.SphereGeometry(1800, 24, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite:false, fog:false,
  uniforms: { uTime:{value:0} },
  vertexShader: `varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `
    varying vec3 vP; uniform float uTime;
    void main(){
      float h = normalize(vP).y;
      vec3 horizon = vec3(0.78,0.72,0.62);           // warm haze
      vec3 mid     = vec3(0.45,0.62,0.78);
      vec3 zenith  = vec3(0.12,0.28,0.48);
      vec3 col = mix(horizon, mid, smoothstep(0.0,0.25,h));
      col = mix(col, zenith, smoothstep(0.25,0.8,h));
      // sun glow
      vec3 sunDir = normalize(vec3(0.5,0.35,0.4));
      float s = max(dot(normalize(vP), sunDir), 0.0);
      col += vec3(1.0,0.85,0.6)*pow(s, 220.0)*1.4;   // disc
      col += vec3(1.0,0.8,0.55)*pow(s, 6.0)*0.22;    // haze
      // slow drifting clouds
      float cl = sin(vP.x*0.004+uTime*0.02)*sin(vP.z*0.005-uTime*0.015);
      cl = smoothstep(0.55,0.95,cl)*smoothstep(0.05,0.3,h)*0.25;
      col = mix(col, vec3(0.95,0.93,0.9), cl);
      gl_FragColor = vec4(col,1.0);
    }`
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// ---------- lights ----------
const sun = new THREE.DirectionalLight(0xfff2dd, 1.15);
sun.position.set(120, 90, 90);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbdd8ee, 0x0a2436, 0.75));

// ---------- INFINITE OCEAN (Gerstner waves in shader) ----------
const WAVE_UNIFORMS = {
  uTime:      { value: 0 },
  uSunDir:    { value: new THREE.Vector3(0.6,0.5,0.45).normalize() },
  uCamPos:    { value: new THREE.Vector3() },
  uFogColor:  { value: new THREE.Color(0x9db8c8) },
  uFogDensity:{ value: 0.0016 }
};

const oceanMat = new THREE.ShaderMaterial({
  uniforms: WAVE_UNIFORMS,
  vertexShader: `
    uniform float uTime;
    varying vec3 vNormal; varying vec3 vWorld; varying float vFoam;
    // 4 Gerstner waves — returns displaced pos + accumulates normal
    vec3 gerstner(vec2 xz, out vec3 nrm, out float foam){
      vec3 p = vec3(xz.x, 0.0, xz.y);
      vec3 n = vec3(0.0,1.0,0.0); foam = 0.0;
      // dir, steepness, wavelength, speed
      vec2 D[4]; float S[4]; float L[4]; float V[4];
      D[0]=normalize(vec2(1.0,0.3));  S[0]=0.22; L[0]=38.0; V[0]=5.5;
      D[1]=normalize(vec2(-0.6,1.0)); S[1]=0.18; L[1]=21.0; V[1]=4.2;
      D[2]=normalize(vec2(0.8,-0.7)); S[2]=0.14; L[2]=11.0; V[2]=3.1;
      D[3]=normalize(vec2(-0.3,-1.0));S[3]=0.10; L[3]=6.0;  V[3]=2.4;
      for(int i=0;i<4;i++){
        float k = 6.28318/L[i];
        float f = k*(dot(D[i],xz)-V[i]*uTime);
        float a = S[i]/k;
        p.x += D[i].x*a*cos(f);
        p.z += D[i].y*a*cos(f);
        p.y += a*sin(f);
        n.x -= D[i].x*S[i]*cos(f);
        n.z -= D[i].y*S[i]*cos(f);
        n.y -= S[i]*sin(f)*0.5;
        foam += max(sin(f),0.0)*S[i];
      }
      nrm = normalize(n); return p;
    }
    void main(){
      vec3 n; float f;
      vec3 wp = (modelMatrix*vec4(position,1.0)).xyz;
      vec3 p = gerstner(wp.xz, n, f);
      vNormal = n; vFoam = f;
      vWorld = vec3(p.x, p.y, p.z);
      gl_Position = projectionMatrix*viewMatrix*vec4(vWorld,1.0);
    }`,
  fragmentShader: `
    uniform vec3 uSunDir; uniform vec3 uCamPos;
    uniform vec3 uFogColor; uniform float uFogDensity; uniform float uTime;
    varying vec3 vNormal; varying vec3 vWorld; varying float vFoam;
    void main(){
      vec3 N = normalize(vNormal);
      // fine ripple detail (fake normal perturbation)
      N.xz += 0.06*vec2(sin(vWorld.x*1.7+uTime*2.0), cos(vWorld.z*1.5+uTime*1.7));
      N = normalize(N);
      vec3 V = normalize(uCamPos - vWorld);
      float fres = pow(1.0-max(dot(N,V),0.0), 3.0);
      vec3 deep = vec3(0.015,0.10,0.17);
      vec3 shallow = vec3(0.05,0.32,0.40);
      vec3 skyRef = vec3(0.55,0.70,0.82);
      vec3 col = mix(deep, shallow, max(N.y,0.0)*0.6 + vFoam*0.4);
      col = mix(col, skyRef, fres*0.75);
      // sun specular
      vec3 H = normalize(uSunDir+V);
      col += vec3(1.0,0.9,0.7)*pow(max(dot(N,H),0.0), 260.0)*2.2;
      col += vec3(1.0,0.9,0.7)*pow(max(dot(N,H),0.0), 24.0)*0.12;
      // foam on crests
      float foam = smoothstep(0.55,0.85,vFoam)*0.5;
      col = mix(col, vec3(0.9,0.95,0.97), foam);
      // fog
      float d = length(uCamPos-vWorld);
      float fogF = 1.0-exp(-uFogDensity*uFogDensity*d*d);
      col = mix(col, uFogColor, fogF);
      gl_FragColor = vec4(col,1.0);
    }`
});

// ocean = grid of tiles that follow the player → infinite
const TILE = 160, GRID = 9, oceanTiles = [];
const tileGeo = new THREE.PlaneGeometry(TILE, TILE, 48, 48);
tileGeo.rotateX(-Math.PI/2);
for (let i=0;i<GRID*GRID;i++){
  const m = new THREE.Mesh(tileGeo, oceanMat);
  m.frustumCulled = false;
  scene.add(m); oceanTiles.push(m);
}
function updateOceanTiles(px, pz){
  const half = Math.floor(GRID/2);
  const cx = Math.round(px/TILE), cz = Math.round(pz/TILE);
  let i = 0;
  for (let gx=-half; gx<=half; gx++)
    for (let gz=-half; gz<=half; gz++){
      oceanTiles[i].position.set((cx+gx)*TILE, 0, (cz+gz)*TILE);
      i++;
    }
}

// CPU copy of the waves (for boat physics / floating objects)
function waveHeight(x, z, t){
  const W = [
    [1,0.3,0.22,38,5.5],[-0.6,1,0.18,21,4.2],[0.8,-0.7,0.14,11,3.1],[-0.3,-1,0.10,6,2.4]
  ];
  let y = 0;
  for (const [dx,dz,s,l,v] of W){
    const len = Math.hypot(dx,dz), nx=dx/len, nz=dz/len;
    const k = Math.PI*2/l, a = s/k;
    y += a*Math.sin(k*((nx*x+nz*z)-v*t));
  }
  return y;
}

// ---------- game state ----------
const state = {
  mode: 'boat',           // 'boat' | 'swim'
  time: 0,
  boat: { pos:new THREE.Vector3(0,0,0), heading:0, speed:0 },
  swim: { pos:new THREE.Vector3(6,0,0), heading:0, speed:0 },
  camYaw: 0, camPitch: 0.32
};

// ---------- load models (from /models scripts) ----------
const boat = Models.Boat(); scene.add(boat.group);
const registry = [];   // spawned world objects (islands, buoys, fish schools...)

// ---------- infinite world content: seeded chunks ----------
const CHUNK = 300;
const spawned = new Map(); // "cx,cz" -> array of objects
function hash(x,z){ let h=(x*374761393+z*668265263)|0; h=(h^(h>>13))*1274126177; return ((h^(h>>16))>>>0)/4294967295; }

function spawnChunk(cx, cz){
  const key = cx+','+cz, objs = [];
  const r = hash(cx,cz);
  if (r < 0.35){ // island
    const isl = Models.Island(r);
    isl.group.position.set(cx*CHUNK + (hash(cx,cz+7)-0.5)*CHUNK*0.7, 0, cz*CHUNK + (hash(cx+3,cz)-0.5)*CHUNK*0.7);
    scene.add(isl.group); objs.push(isl);
  }
  if (r > 0.5 && r < 0.7){ // buoy
    const b = Models.Buoy();
    b.group.position.set(cx*CHUNK+(hash(cx,cz+11)-0.5)*CHUNK, 0, cz*CHUNK+(hash(cx+5,cz)-0.5)*CHUNK);
    scene.add(b.group); objs.push(b);
  }
  // fish schools everywhere
  const school = Models.FishSchool(3+Math.floor(r*5));
  school.group.position.set(cx*CHUNK+(hash(cx,cz+13)-0.5)*CHUNK, -2.5, cz*CHUNK+(hash(cx+9,cz)-0.5)*CHUNK);
  scene.add(school.group); objs.push(school);
  spawned.set(key, objs);
}
function updateChunks(px, pz){
  const cx = Math.round(px/CHUNK), cz = Math.round(pz/CHUNK);
  for (let x=cx-1;x<=cx+1;x++) for (let z=cz-1;z<=cz+1;z++){
    if (!spawned.has(x+','+z)) spawnChunk(x,z);
  }
  for (const [key, objs] of spawned){
    const [kx,kz] = key.split(',').map(Number);
    if (Math.abs(kx-cx)>2 || Math.abs(kz-cz)>2){
      objs.forEach(o=>scene.remove(o.group));
      spawned.delete(key);
    }
  }
}

// ---------- particles ----------
const particles = new ParticleSystem(scene, 1500);

// ---------- INPUT (iPad touch + mouse/keys) ----------
const input = { mx:0, mz:0, lookDX:0, lookDY:0 };
const keys = {};
addEventListener('keydown', e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',   e=>keys[e.key.toLowerCase()]=false);

// virtual joystick
const joy = document.getElementById('joy'), stick = document.getElementById('stick');
let joyId = null, joyCX=0, joyCY=0;
joy.addEventListener('touchstart', e=>{
  const t = e.changedTouches[0]; joyId = t.identifier;
  const r = joy.getBoundingClientRect(); joyCX=r.left+r.width/2; joyCY=r.top+r.height/2;
  e.preventDefault();
},{passive:false});
addEventListener('touchmove', e=>{
  for (const t of e.changedTouches){
    if (t.identifier===joyId){
      let dx=(t.clientX-joyCX)/55, dy=(t.clientY-joyCY)/55;
      const m=Math.hypot(dx,dy); if(m>1){dx/=m;dy/=m;}
      input.mx=dx; input.mz=dy;
      stick.style.transform=`translate(calc(-50% + ${dx*38}px), calc(-50% + ${dy*38}px))`;
    } else if (t.identifier===lookId){
      input.lookDX += t.clientX-lookX; input.lookDY += t.clientY-lookY;
      lookX=t.clientX; lookY=t.clientY;
    }
  }
  e.preventDefault();
},{passive:false});
addEventListener('touchend', e=>{
  for (const t of e.changedTouches){
    if (t.identifier===joyId){ joyId=null; input.mx=input.mz=0;
      stick.style.transform='translate(-50%,-50%)'; }
    if (t.identifier===lookId) lookId=null;
  }
});
// right-half look drag
let lookId=null, lookX=0, lookY=0;
addEventListener('touchstart', e=>{
  for (const t of e.changedTouches)
    if (t.clientX > innerWidth*0.4 && lookId===null && !e.target.closest('#modeBtn,#title')){
      lookId=t.identifier; lookX=t.clientX; lookY=t.clientY;
    }
},{passive:true});
// mouse look
let mDown=false, mX=0, mY=0;
addEventListener('mousedown', e=>{ if(e.target===canvas){mDown=true;mX=e.clientX;mY=e.clientY;} });
addEventListener('mousemove', e=>{ if(mDown){ input.lookDX+=e.clientX-mX; input.lookDY+=e.clientY-mY; mX=e.clientX;mY=e.clientY; }});
addEventListener('mouseup', ()=>mDown=false);

// mode toggle
document.getElementById('modeBtn').addEventListener('click', ()=>{
  if (state.mode==='boat'){
    state.mode='swim';
    state.swim.pos.copy(state.boat.pos).add(new THREE.Vector3(3,0,0));
    state.swim.heading = state.boat.heading;
    document.getElementById('modeBtn').textContent='🏊 Swim';
    particles.burst(state.swim.pos.x, 0.3, state.swim.pos.z, 40, 'splash');
  } else {
    state.mode='boat';
    state.boat.pos.copy(state.swim.pos);
    document.getElementById('modeBtn').textContent='🚤 Boat';
    particles.burst(state.boat.pos.x, 0.3, state.boat.pos.z, 40, 'splash');
  }
});

// ---------- main loop ----------
const clock = new THREE.Clock();
function active(){ return state.mode==='boat' ? state.boat : state.swim; }

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  state.time += dt;
  const t = state.time;

  // keyboard → input
  let ix = input.mx, iz = input.mz;
  if (keys['w']||keys['arrowup']) iz=-1;
  if (keys['s']||keys['arrowdown']) iz=1;
  if (keys['a']||keys['arrowleft']) ix=-1;
  if (keys['d']||keys['arrowright']) ix=1;

  // camera orbit from look input
  state.camYaw   -= input.lookDX*0.004;
  state.camPitch  = THREE.MathUtils.clamp(state.camPitch + input.lookDY*0.003, 0.05, 1.1);
  input.lookDX = input.lookDY = 0;

  const A = active();
  const isBoat = state.mode==='boat';
  const maxSpd = isBoat ? 14 : 4.5;

  // movement relative to camera yaw
  const fwd = new THREE.Vector3(-Math.sin(state.camYaw),0,-Math.cos(state.camYaw));
  const right = new THREE.Vector3(-fwd.z,0,fwd.x);
  const move = new THREE.Vector3().addScaledVector(fwd,-iz).addScaledVector(right,ix);
  if (move.lengthSq()>0.01){
    move.normalize();
    const target = Math.atan2(move.x, move.z);
    let d = target - A.heading;
    while (d>Math.PI) d-=Math.PI*2; while (d<-Math.PI) d+=Math.PI*2;
    A.heading += d * Math.min(1, dt*(isBoat?2.2:5));
    A.speed += (maxSpd - A.speed)*dt*(isBoat?0.8:2.5);
  } else {
    A.speed += (0 - A.speed)*dt*(isBoat?0.5:3);
  }
  A.pos.x += Math.sin(A.heading)*A.speed*dt;
  A.pos.z += Math.cos(A.heading)*A.speed*dt;

  // ---- boat physics: sample wave at 3 points → pitch/roll/bob ----
  const b = state.boat;
  const hC = waveHeight(b.pos.x, b.pos.z, t);
  const hF = waveHeight(b.pos.x+Math.sin(b.heading)*3, b.pos.z+Math.cos(b.heading)*3, t);
  const hS = waveHeight(b.pos.x+Math.cos(b.heading)*2, b.pos.z-Math.sin(b.heading)*2, t);
  boat.group.position.set(b.pos.x, hC+0.35, b.pos.z);
  boat.group.rotation.set(0, -b.heading, 0);
  boat.group.rotateX((hF-hC)*0.22);
  boat.group.rotateZ((hS-hC)*0.28);
  boat.update(t, dt, b.speed);

  // boat wake + bow spray
  if (isBoat && b.speed>3){
    const bx = b.pos.x-Math.sin(b.heading)*4, bz = b.pos.z-Math.cos(b.heading)*4;
    particles.emit(bx, waveHeight(bx,bz,t)+0.2, bz, 2, 'wake', b.speed);
    if (b.speed>9){
      const fx = b.pos.x+Math.sin(b.heading)*4.5, fz = b.pos.z+Math.cos(b.heading)*4.5;
      particles.emit(fx, waveHeight(fx,fz,t)+0.4, fz, 3, 'spray', b.speed);
    }
  }

  // ---- swimmer ----
  const s = state.swim;
  if (!isBoat){
    const hS2 = waveHeight(s.pos.x, s.pos.z, t);
    s.pos.y = hS2 + 0.15;
    if (s.speed>1 && Math.random()<0.3)
      particles.burst(s.pos.x, s.pos.y+0.1, s.pos.z, 2, 'splash');
  }

  // swimmer visual: simple head + arms bobbing
  swimmer.position.copy(s.pos);
  swimmer.visible = !isBoat;
  swimmer.rotation.y = -s.heading;
  swimmer.children[1].rotation.x = Math.sin(t*6)*0.9;   // arm paddle
  swimmer.children[2].rotation.x = -Math.sin(t*6)*0.9;

  // ---- camera ----
  const anchor = isBoat ? boat.group.position : s.pos;
  const dist = isBoat ? 16 : 8, height = isBoat ? 6 : 3;
  const co = new THREE.Vector3(
    Math.sin(state.camYaw)*Math.cos(state.camPitch),
    Math.sin(state.camPitch),
    Math.cos(state.camYaw)*Math.cos(state.camPitch)
  ).multiplyScalar(dist);
  const camTarget = anchor.clone().add(co).add(new THREE.Vector3(0,height*0.4,0));
  camera.position.lerp(camTarget, 1-Math.pow(0.001, dt));
  const minY = waveHeight(camera.position.x, camera.position.z, t)+1.2;
  if (camera.position.y < minY) camera.position.y = minY;
  camera.lookAt(anchor.x, anchor.y+2, anchor.z);

  // ---- world ----
  WAVE_UNIFORMS.uTime.value = t;
  WAVE_UNIFORMS.uCamPos.value.copy(camera.position);
  skyMat.uniforms.uTime.value = t;
  scene.children[0].position.copy(camera.position); // sky follows
  updateOceanTiles(A.pos.x, A.pos.z);
  updateChunks(A.pos.x, A.pos.z);

  // update spawned models (floating, fish swimming...)
  for (const objs of spawned.values())
    for (const o of objs) o.update && o.update(t, dt, waveHeight);

  particles.update(dt, camera);

  document.getElementById('coord').textContent =
    `${Math.abs(A.pos.z/10).toFixed(1)}° ${A.pos.z>=0?'N':'S'} · ${Math.abs(A.pos.x/10).toFixed(1)}° ${A.pos.x>=0?'E':'W'}`;

  renderer.render(scene, camera);
}

// simple swimmer mesh
const swimmer = new THREE.Group();
const skin = new THREE.MeshLambertMaterial({color:0xd9a077});
swimmer.add(new THREE.Mesh(new THREE.SphereGeometry(0.35,10,8), skin)); // head
swimmer.children[0].position.y = 0.35;
const armG = new THREE.SphereGeometry(0.14,6,5);
const armL = new THREE.Mesh(armG, skin); armL.position.set(-0.45,0.15,0); swimmer.add(armL);
const armR = new THREE.Mesh(armG, skin); armR.position.set( 0.45,0.15,0); swimmer.add(armR);
swimmer.visible = false;
scene.add(swimmer);

// ---------- resize / start ----------
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
document.getElementById('playBtn').addEventListener('click', ()=>{
