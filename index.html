<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FDF6F5">
    <title>Interactive Physics Lab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #FDF6F5;
            overscroll-behavior: none;
            touch-action: none;
            font-family: "Quicksand", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas#gl {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* Pastel UI Glass */
        .glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(18px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 12px 38px rgba(220, 195, 210, 0.35);
            border-radius: 24px;
        }

        #topPanel {
            position: fixed;
            top: calc(14px + env(safe-area-inset-top, 0px));
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px 10px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            max-width: 94vw;
        }

        #topPanel h1 {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.32em;
            color: #b096a6;
            text-transform: uppercase;
        }

        #stats {
            display: flex;
            gap: 18px;
            justify-content: center;
            margin-top: 8px;
        }

        .stat {
            min-width: 44px;
        }

        .stat b {
            display: block;
            font-size: 14px;
            font-weight: 800;
            color: #7a6372;
            font-variant-numeric: tabular-nums;
        }

        .stat span {
            font-size: 8px;
            letter-spacing: 0.16em;
            color: #b096a6;
            text-transform: uppercase;
            font-weight: 700;
        }

        #bottomBar {
            position: fixed;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            padding: 10px;
            z-index: 10;
        }

        #bottomBar button {
            border: 2px solid rgba(255, 255, 255, 1);
            background: rgba(255, 255, 255, 0.6);
            color: #9c8493;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            padding: 10px 16px;
            border-radius: 18px;
            cursor: pointer;
            transition: all .25s cubic-bezier(.4, 0, .2, 1);
            white-space: nowrap;
        }

        #bottomBar button:active {
            transform: scale(0.92);
        }

        #bottomBar button.on {
            background: #ffb7b2;
            border-color: #ffb7b2;
            color: #fff;
            box-shadow: 0 6px 20px rgba(255, 183, 178, 0.55);
        }

        #slowBadge {
            position: fixed;
            top: calc(96px + env(safe-area-inset-top, 0px));
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            padding: 7px 18px;
            border-radius: 20px;
            z-index: 10;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.24em;
            color: #ff919a;
            background: rgba(255, 240, 245, 0.85);
            border: 2px solid rgba(255, 183, 178, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: all .35s;
        }

        #slowBadge.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            50% {
                box-shadow: 0 0 0 8px rgba(255, 183, 178, 0.25);
            }
        }

        #hint {
            position: fixed;
            bottom: calc(90px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: 600;
            color: #a4919e;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            z-index: 9;
            pointer-events: none;
            transition: opacity 1s;
            white-space: nowrap;
        }

        #loader {
            position: fixed;
            inset: 0;
            background: #FDF6F5;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            transition: opacity .6s;
        }

        #loader .dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #ffc8c4, #ff8da1);
            animation: drop 0.9s cubic-bezier(.5, 0, .5, 1) infinite;
        }

        @keyframes drop {

            0%,
            100% {
                transform: translateY(-18px) scale(1, 1);
            }

            50% {
                transform: translateY(12px) scale(1.3, 0.75);
            }
        }

        #loader p {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.35em;
            color: #b096a6;
            text-transform: uppercase;
        }

        @media (orientation:landscape) and (max-height:480px) {
            #stats .stat:nth-child(n+3) {
                display: none;
            }

            #bottomBar button {
                padding: 8px 12px;
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

    <canvas id="gl"></canvas>

    <div id="topPanel" class="glass">
        <h1>Interactive Physics Lab</h1>
        <div id="stats">
            <div class="stat"><b id="sVel">0.0</b><span>Vel m/s</span></div>
            <div class="stat"><b id="sHgt">0.0</b><span>Height</span></div>
            <div class="stat"><b id="sEn">0</b><span>Energy</span></div>
            <div class="stat"><b id="sFps">60</b><span>FPS</span></div>
        </div>
    </div>

    <div id="slowBadge">● SLOW MOTION</div>
    <div id="hint">Use left side of screen to move · Drag right side to orbit</div>

    <div id="bottomBar" class="glass">
        <button id="bReset">Reset</button>
        <button id="bSlow">Slow-Mo</button>
        <button id="bCam">Orbit</button>
        <button id="bFx" class="on">FX</button>
        <button id="bSnd" class="on">Sound</button>
    </div>

    <div id="loader">
        <div class="dot"></div>
        <p>Loading Lab</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="assets.js"></script>
    <script>
        (function () {
'use strict';

/* ============================================================
   0. CONSTANTS / STATE
============================================================ */
var R        = 0.55;
var GRAV     = 30.0;
var REST     = 0.78;
var MAX_V    = 45.0;
var FIXED_DT = 1/120;
var BOUNDS   = { x:8, yTop:11, z:5 };
var WALL     = { x:4.2, hx:0.31, h:4.26, hz:6.06 };

var flags = { fx:true, snd:true, slow:false, orbit:false };
var timeScale = 1, timeScaleTarget = 1;
var quality = 0;
var shake = 0;

/* ============================================================
   1. RENDERER / SCENE / CAMERA & HUD JOYSTICK SETUP
============================================================ */
var canvas = document.getElementById('gl');
var renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas:canvas, antialias:true, powerPreference:'high-performance' });
} catch (e) {
  document.getElementById('loader').innerHTML = '<p>WebGL not supported</p>';
  return;
}
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.autoClear = false; // Important for HUD layering

var scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xFDF6F5, 34, 72);

var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);

/* --- Orthographic HUD for 3D Joystick --- */
var hudScene = new THREE.Scene();
var hudCamera = new THREE.OrthographicCamera(-window.innerWidth/2, window.innerWidth/2, window.innerHeight/2, -window.innerHeight/2, 0.1, 100);
hudCamera.position.z = 10;

// Setup the Joystick Meshes
var joyMatBase = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4 });
var joyMatStick = new THREE.MeshBasicMaterial({ color: 0xffb7c5 });
var joyBase = new THREE.Mesh(new THREE.TorusGeometry(35, 3, 16, 32), joyMatBase);
var joyStick = new THREE.Mesh(new THREE.SphereGeometry(18, 32, 32), joyMatStick);
hudScene.add(joyBase);
hudScene.add(joyStick);

// State for handling Joystick logic
var joyActive = false;
var joyId = -1;
var joyStart = new THREE.Vector2();
var joyVector = new THREE.Vector2();

/* ---- environment gradient (pastel sky dome) ---- */
(function () {
  var geo = new THREE.SphereGeometry(80, 24, 16);
  var mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{ cTop:{value:new THREE.Color(0xdce2f0)}, cBot:{value:new THREE.Color(0xffeaf0)} },
    vertexShader:'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:'varying vec3 vP; uniform vec3 cTop; uniform vec3 cBot;'+
      'void main(){ float h=clamp(normalize(vP).y*0.5+0.5,0.0,1.0);'+
      'vec3 c=mix(cBot,cTop,pow(h,0.8)); gl_FragColor=vec4(c,1.0); }'
  });
  scene.add(new THREE.Mesh(geo, mat));
})();

/* ---- procedural equirect environment map (soft pastel reflections) ---- */
(function () {
  var c = document.createElement('canvas'); c.width = 512; c.height = 256;
  var g = c.getContext('2d');
  var gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.5, '#fce4ea'); gr.addColorStop(1, '#e6dced');
  g.fillStyle = gr; g.fillRect(0, 0, 512, 256);
  function blob(x, y, r, a) {
    var rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, 'rgba(255,255,255,' + a + ')');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rg; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  blob(120, 60, 70, 0.95); blob(390, 80, 55, 0.7); blob(260, 40, 90, 0.5);
  var tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.encoding = THREE.sRGBEncoding;
  scene.environment = tex;
})();

/* ============================================================
   2. LIGHTS  (pastel key / fill / rim / ambient)
============================================================ */
scene.add(new THREE.HemisphereLight(0xfff6fa, 0xd4cbe5, 0.6));

var key = new THREE.DirectionalLight(0xfff0f5, 1.05);
key.position.set(6, 11, 7);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -14; key.shadow.camera.right = 14;
key.shadow.camera.top = 14;  key.shadow.camera.bottom = -14;
key.shadow.camera.near = 2;  key.shadow.camera.far = 40;
key.shadow.bias = -0.0006;
scene.add(key);

var fill = new THREE.DirectionalLight(0xe0f7fa, 0.35);
fill.position.set(-8, 4, -3); scene.add(fill);

var rim = new THREE.DirectionalLight(0xffe4fa, 0.65);
rim.position.set(-4, 7, -9); scene.add(rim);

var flashLights = [];
for (var fi = 0; fi < 2; fi++) {
  var fl = new THREE.PointLight(0xffb7b2, 0, 9, 2);
  scene.add(fl); flashLights.push({ l:fl, i:0 });
}

/* ============================================================
   3. ENVIRONMENT MESHES  (floor, curved studio, wall)
============================================================ */
var floor = new THREE.Mesh(
  new THREE.CircleGeometry(45, 48),
  new THREE.MeshStandardMaterial({ color:0xfdf5f7, roughness:0.25, metalness:0.05, envMapIntensity:0.65 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

(function () {
  var w = 12.2, h = WALL.h, r = 0.18;
  var s = new THREE.Shape();
  s.moveTo(-w/2 + r, 0); s.lineTo( w/2 - r, 0); s.absarc( w/2 - r, r, r, -Math.PI/2, 0, false);
  s.lineTo( w/2, h - r); s.absarc( w/2 - r, h - r, r, 0, Math.PI/2, false);
  s.lineTo(-w/2 + r, h); s.absarc(-w/2 + r, h - r, r, Math.PI/2, Math.PI, false);
  s.lineTo(-w/2, r); s.absarc(-w/2 + r, r, r, Math.PI, Math.PI*1.5, false);
  var geo = new THREE.ExtrudeGeometry(s, { depth:0.5, bevelEnabled:true, bevelThickness:0.06, bevelSize:0.06, bevelSegments:3, steps:1 });
  var mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color:0xebe3ec, roughness:0.45, metalness:0.0, envMapIntensity:0.5 }));
  mesh.rotation.y = Math.PI / 2; mesh.position.set(WALL.x - 0.25, 0, 0);
  mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
})();

/* ============================================================
   4. THE BALL  (pastel material + glow + shadow)
============================================================ */
var roughMap = (function () {
  var c = document.createElement('canvas'); c.width = c.height = 128;
  var g = c.getContext('2d');
  g.fillStyle = '#777'; g.fillRect(0, 0, 128, 128);
  for (var i = 0; i < 380; i++) {
    var v = 100 + Math.random() * 60 | 0;
    g.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',0.12)';
    g.fillRect(Math.random()*128, Math.random()*128, 2 + Math.random()*4, 2 + Math.random()*4);
  }
  return new THREE.CanvasTexture(c);
})();

var deform = new THREE.Group();
scene.add(deform);

var ballMat = new THREE.MeshPhysicalMaterial({
  color:0xffb7c5, roughness:0.2, metalness:0.0,
  clearcoat:1.0, clearcoatRoughness:0.1,
  roughnessMap:roughMap, envMapIntensity:1.3
});
var ballMesh = new THREE.Mesh(new THREE.SphereGeometry(R, 48, 32), ballMat);
ballMesh.castShadow = true;
deform.add(ballMesh);

var glowMat = new THREE.ShaderMaterial({
  transparent:true, blending:THREE.AdditiveBlending, depthWrite:false,
  uniforms:{ uPower:{ value:0 }, uColor:{ value:new THREE.Color(0xffe6eb) } },
  vertexShader: 'varying float vF; void main(){ vec3 n=normalize(normalMatrix*normal); vec4 mv=modelViewMatrix*vec4(position,1.0); vec3 vd=normalize(-mv.xyz); vF=pow(1.0-abs(dot(n,vd)),2.5); gl_Position=projectionMatrix*mv; }',
  fragmentShader: 'uniform float uPower; uniform vec3 uColor; varying float vF; void main(){ gl_FragColor=vec4(uColor, vF*uPower); }'
});
var glowMesh = new THREE.Mesh(new THREE.SphereGeometry(R * 1.18, 32, 24), glowMat);
deform.add(glowMesh);

var contactShadow = (function () {
  var c = document.createElement('canvas'); c.width = c.height = 128;
  var g = c.getContext('2d');
  var rg = g.createRadialGradient(64, 64, 4, 64, 64, 62);
  rg.addColorStop(0, 'rgba(70,50,60,0.45)');
  rg.addColorStop(1, 'rgba(70,50,60,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
  var m = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map:new THREE.CanvasTexture(c), transparent:true, depthWrite:false })
  );
  m.rotation.x = -Math.PI / 2; m.position.y = 0.012; m.renderOrder = 1;
  scene.add(m); return m;
})();

var ball = { p:new THREE.Vector3(-3, 4, 0), v:new THREE.Vector3(), w:new THREE.Vector3(), squash:0, squashN:new THREE.Vector3(0,1,0), target:new THREE.Vector3() };

/* ============================================================
   5. POOLED CUSTOM VFX — Enhanced Sparks, Dust, Trail
============================================================ */
var P_MAX = 240;
var pGeo = new THREE.IcosahedronGeometry(0.105, 1);
var pMat = new THREE.MeshStandardMaterial({
  color:0xffffff,
  roughness:0.18,
  metalness:0.15,
  emissive:0xffffff,
  emissiveIntensity:1.15,
  transparent:true,
  blending:THREE.AdditiveBlending,
  depthWrite:false
});
var pMesh = new THREE.InstancedMesh(pGeo, pMat, P_MAX);
pMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
pMesh.frustumCulled = false;
scene.add(pMesh);

var pDummy = new THREE.Object3D();
var pPos = new Float32Array(P_MAX * 3);
var pVel = new Float32Array(P_MAX * 3);
var pRot = new Float32Array(P_MAX * 3);
var pRotV = new Float32Array(P_MAX * 3);
var pAge = new Float32Array(P_MAX);
var pLife = new Float32Array(P_MAX);
var pScale = new Float32Array(P_MAX);
var pSeed = new Float32Array(P_MAX);

var colorArray = new Float32Array(P_MAX * 3);
pMesh.instanceColor = new THREE.InstancedBufferAttribute(colorArray, 3);
var pColor = new THREE.Color();
var pastelColors = [0xffb7b2, 0xffd1dc, 0xb2ffda, 0xdcf4ff, 0xffe4f0];

pDummy.position.set(0, -50, 0);
pDummy.updateMatrix();
for (var i = 0; i < P_MAX; i++) {
  pAge[i] = 999;
  pLife[i] = 1;
  pMesh.setMatrixAt(i, pDummy.matrix);
}
pMesh.instanceMatrix.needsUpdate = true;
var pCursor = 0;

function spawnBurst(pos, n, power) {
  if (!flags.fx) return;

  var count = Math.min(38, 8 + (power * 30 | 0));
  var tangentA = new THREE.Vector3();
  var tangentB = new THREE.Vector3();

  if (Math.abs(n.y) < 0.9) tangentA.set(0,1,0).cross(n).normalize();
  else tangentA.set(1,0,0).cross(n).normalize();
  tangentB.copy(n).cross(tangentA).normalize();

  for (var i = 0; i < count; i++) {
    var idx = pCursor;
    pCursor = (pCursor + 1) % P_MAX;

    var a = Math.random() * Math.PI * 2;
    var radial = Math.sqrt(Math.random());
    var outward = 0.35 + Math.random() * 0.95;
    var lift = Math.random() * 0.9;
    var sp = (2.2 + Math.random() * 5.2) * (0.55 + power * 0.9);

    var tx = Math.cos(a) * radial;
    var tz = Math.sin(a) * radial;

    pPos[idx*3]   = pos.x + n.x * 0.075 + (tangentA.x * tx + tangentB.x * tz) * 0.035;
    pPos[idx*3+1] = pos.y + n.y * 0.075 + (tangentA.y * tx + tangentB.y * tz) * 0.035;
    pPos[idx*3+2] = pos.z + n.z * 0.075 + (tangentA.z * tx + tangentB.z * tz) * 0.035;

    pVel[idx*3]   = n.x * sp * (1.45 + power) + (tangentA.x * tx + tangentB.x * tz) * sp * outward;
    pVel[idx*3+1] = n.y * sp * (1.45 + power) + (tangentA.y * tx + tangentB.y * tz) * sp * outward + lift * sp * 0.35;
    pVel[idx*3+2] = n.z * sp * (1.45 + power) + (tangentA.z * tx + tangentB.z * tz) * sp * outward;

    pRot[idx*3] = Math.random() * Math.PI * 2;
    pRot[idx*3+1] = Math.random() * Math.PI * 2;
    pRot[idx*3+2] = Math.random() * Math.PI * 2;

    pRotV[idx*3] = (Math.random()-0.5) * 22;
    pRotV[idx*3+1] = (Math.random()-0.5) * 22;
    pRotV[idx*3+2] = (Math.random()-0.5) * 22;

    pAge[idx] = 0;
    pLife[idx] = 0.32 + Math.random() * 0.58 + power * 0.12;
    pScale[idx] = 0.38 + Math.random() * 0.95 + power * 0.42;
    pSeed[idx] = Math.random();

    pColor.setHex(pastelColors[Math.floor(Math.random() * pastelColors.length)]);
    colorArray[idx*3] = pColor.r;
    colorArray[idx*3+1] = pColor.g;
    colorArray[idx*3+2] = pColor.b;
  }
  pMesh.instanceColor.needsUpdate = true;
}

function clearParticles() {
  for (var i = 0; i < P_MAX; i++) {
    pAge[i] = 999;
    pLife[i] = 1;
    pMesh.setMatrixAt(i, pDummy.matrix);
  }
  pMesh.instanceMatrix.needsUpdate = true;
}

/* Ambient floating dust with softer, varied motion. */
var DUST_N = 72;
var dustGeo = new THREE.BufferGeometry();
(function () {
  var dp = new Float32Array(DUST_N * 3), ds = new Float32Array(DUST_N);
  for (var i = 0; i < DUST_N; i++) {
    dp[i*3] = (Math.random()-0.5) * 22;
    dp[i*3+1] = 0.25 + Math.random() * 7.5;
    dp[i*3+2] = (Math.random()-0.5) * 12;
    ds[i] = Math.random();
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dp, 3));
  dustGeo.setAttribute('aSeed', new THREE.BufferAttribute(ds, 1));
})();

var dustMat = new THREE.ShaderMaterial({
  transparent:true,
  depthWrite:false,
  blending:THREE.AdditiveBlending,
  uniforms:{ uTime:{ value:0 } },
  vertexShader:
    'attribute float aSeed; uniform float uTime; varying float vA; '+
    'void main(){ '+
      'vec3 p=position; float s=aSeed*6.28318; '+
      'p.y += sin(uTime*0.22+s)*0.22 + sin(uTime*0.07+s*2.1)*0.11; '+
      'p.x += sin(uTime*0.12+s*1.7)*0.32; '+
      'p.z += cos(uTime*0.10+s*1.3)*0.24; '+
      'vA=0.035+0.095*fract(aSeed*7.13); '+
      'vec4 mv=modelViewMatrix*vec4(p,1.0); '+
      'gl_PointSize=(0.18+0.22*fract(aSeed*9.7))*(170.0/-mv.z); '+
      'gl_Position=projectionMatrix*mv; '+
    '}',
  fragmentShader:
    'varying float vA; '+
    'void main(){ '+
      'float d=length(gl_PointCoord-0.5); '+
      'float m=1.0-smoothstep(0.08,0.5,d); '+
      'gl_FragColor=vec4(0.92,0.86,0.95,m*vA); '+
    '}'
});
var dust = new THREE.Points(dustGeo, dustMat);
dust.frustumCulled = false;
scene.add(dust);

/* Soft glow layer behind the physical spark meshes. */
var sparkGlowGeo = new THREE.BufferGeometry();
var sparkGlowPos = new Float32Array(P_MAX * 3);
var sparkGlowSize = new Float32Array(P_MAX);
sparkGlowGeo.setAttribute('position', new THREE.BufferAttribute(sparkGlowPos, 3));

var impactClock = 0;

function impact(n, speed, cx, cy, cz, isWall) {

  if (pw <= 0.02) return;

  ball.squash = Math.max(ball.squash, pw * 0.42);
  ball.squashN.copy(n);
  tmpV5.set(cx, cy, cz);

    var f = flashLights[0].i < flashLights[1].i ? flashLights[0] : flashLights[1];
    f.i = pw * 6.5;

function collidePlanes() {
  var p = ball.p, v = ball.v;

  if (p.y - R < 0) {
    var wasFalling = v.y < -0.08;
    var impactSpeed = Math.max(0, -v.y);
    p.y = R;

    if (wasFalling) {
      if (impactSpeed > 1.4) impact(tmpV6.set(0,1,0), impactSpeed, p.x, 0.02, p.z, false);
      v.y = impactSpeed > 1.4 ? impactSpeed * REST : 0;
      exchangeSpin(0, 1, 0);
    } else if (v.y < 0) {
      v.y = 0;

  if (p.y + R > BOUNDS.yTop) {
    p.y = BOUNDS.yTop - R;
    if (v.y > 0) {
      impact(tmpV6.set(0,-1,0), v.y, p.x, BOUNDS.yTop, p.z, false);
      v.y = -v.y * REST;
    }
  }

  if (p.x - R < -BOUNDS.x) {
    p.x = -BOUNDS.x + R;
    if (v.x < 0) {
      var sx = -v.x;
      if (sx > 1.4) impact(tmpV6.set(1,0,0), sx, -BOUNDS.x, p.y, p.z, false);
      v.x = sx * REST;
      exchangeSpin(1,0,0);
    }
  }

  if (p.z - R < -BOUNDS.z) {
    p.z = -BOUNDS.z + R;
    if (v.z < 0) v.z = -v.z * REST;
  }

  if (p.z + R > BOUNDS.z) {
    p.z = BOUNDS.z - R;
    if (v.z > 0) v.z = -v.z * REST;
  }

function exchangeSpin(nx, ny, nz) {
  var n = tmpV5.set(nx, ny, nz);
  var vn = ball.v.dot(n);
  var vt = tmpV6.copy(ball.v).addScaledVector(n, -vn);
  var vspin = tmpV4.copy(ball.w).cross(n).multiplyScalar(-R);
  var slip = vt.add(vspin);
  var k = 0.18;

  ball.v.addScaledVector(slip, -k);
  ball.w.addScaledVector(tmpV3.copy(n).cross(slip), -k / R);
}

function collideWall() {
  var p = ball.p, v = ball.v;

  var cx = THREE.MathUtils.clamp(p.x, WALL.x - WALL.hx, WALL.x + WALL.hx);
  var cy = THREE.MathUtils.clamp(p.y, 0, WALL.h);
  var cz = THREE.MathUtils.clamp(p.z, -WALL.hz, WALL.hz);

  var dx = p.x - cx, dy = p.y - cy, dz = p.z - cz;
  var d2 = dx*dx + dy*dy + dz*dz;
  if (d2 >= R * R) return false;

  var d = Math.sqrt(d2);
  var n = tmpV6;

  /*
    The wall mesh begins at the floor. At the floor/wall corner, the raw
    AABB closest-point normal can point diagonally upward. That is what
    caused the old solver to fight the floor solver and launch the ball.
    Treat the contact as a vertical wall while the ball is on the floor.
  */
  var nearFloor = p.y <= R + 0.075;
  var horizontalDx = p.x - THREE.MathUtils.clamp(p.x, WALL.x - WALL.hx, WALL.x + WALL.hx);
  var horizontalDz = p.z - THREE.MathUtils.clamp(p.z, -WALL.hz, WALL.hz);
  var horizontalD2 = horizontalDx*horizontalDx + horizontalDz*horizontalDz;

  if (nearFloor && horizontalD2 < R * R) {
    var hd = Math.sqrt(horizontalD2);
    if (hd > 1e-5) {
      n.set(horizontalDx / hd, 0, horizontalDz / hd);
      d = hd;
      cx = p.x - horizontalDx;
      cz = p.z - horizontalDz;
      cy = Math.max(0, Math.min(WALL.h, p.y));
    } else {
      /* Stable side choice from position, never from velocity. */
      n.set(p.x < WALL.x ? -1 : 1, 0, 0);
      d = 0;
      cx = WALL.x;
      cy = Math.max(0, Math.min(WALL.h, p.y));
      cz = p.z;
    }

    n.set(dx / d, dy / d, dz / d);

    /*
      Deep-inside fallback: choose the shortest horizontal escape whenever
      possible. It cannot suddenly acquire a vertical component.

    var side = p.x < WALL.x ? -1 : 1;
    n.set(side, 0, 0);
    d = 0;

  var penetration = R - d;

  /* Never make a giant correction in one solver pass. */
  var correction = Math.min(penetration + 0.0015, 0.12);

  var vn = v.dot(n);

  if (vn < -0.04) {

    /* Remove tiny residual inward velocity after restitution. */
    if (v.dot(n) < 0) v.addScaledVector(n, -v.dot(n));

    if (speedIntoWall > 1.6) impact(n, speedIntoWall, cx, cy, cz, true);

  }

}

function physStep(dt) {
  impactClock = Math.max(0, impactClock - dt);

  if (joyActive) {
    camera.getWorldDirection(tmpV1);
    tmpV1.y = 0;
    if (tmpV1.lengthSq() > 1e-8) tmpV1.normalize();

    tmpV2.crossVectors(tmpV1, UP).normalize();

    tmpV3.set(0,0,0)
      .addScaledVector(tmpV2, joyVector.x)
      .addScaledVector(tmpV1, -joyVector.y);

    ball.v.addScaledVector(tmpV3, 28 * dt);
  }

  ball.v.y -= GRAV * dt;

  var drag = Math.max(0, 1 - 0.1 * dt);
  ball.v.multiplyScalar(drag);
  ball.w.multiplyScalar(Math.max(0, 1 - 0.12 * dt));

  if (ball.v.lengthSq() > MAX_V * MAX_V) ball.v.setLength(MAX_V);

  ball.p.addScaledVector(ball.v, dt);

  /*
    Two short solver passes make floor/wall contacts converge without
    ping-ponging. Floor is resolved first, then the wall is resolved against
    the already-separated position, then the floor is checked once more.
  */
  collidePlanes();
  collideWall();
  collidePlanes();

  /* Hard safety envelope against numerical drift/tunnelling. */
  ball.p.x = THREE.MathUtils.clamp(ball.p.x, -BOUNDS.x + R, BOUNDS.x - R);
  ball.p.y = THREE.MathUtils.clamp(ball.p.y, R, BOUNDS.yTop - R);
  ball.p.z = THREE.MathUtils.clamp(ball.p.z, -BOUNDS.z + R, BOUNDS.z - R);

  if (ball.p.y <= R + 0.05) {
    tmpV1.set(ball.v.z / R, 0, -ball.v.x / R);
    ball.w.lerp(tmpV1, Math.min(1, 13 * dt));
    ball.v.multiplyScalar(Math.max(0, 1 - 0.9 * dt));

    /* A grounded ball should never accumulate downward energy. */
    if (ball.v.y < 0) ball.v.y = 0;
  }

  if (ball.v.lengthSq() > MAX_V * MAX_V) ball.v.setLength(MAX_V);

  var wl = ball.w.length();
  if (wl > 1e-4) {
    tmpQ1.setFromAxisAngle(tmpV2.copy(ball.w).multiplyScalar(1 / wl), wl * dt);

   11. MAIN LOOP
============================================================ */
var acc = 0;
function loop(now) {

  if (rawDt > 0.1) rawDt = 0.1; if (rawDt <= 0) rawDt = 0.0001;

  fpsFrames++; fpsTime += rawDt;
  if (fpsTime >= 0.5) { fpsEMA += (fpsFrames / fpsTime - fpsEMA) * 0.4; fpsFrames = 0; fpsTime = 0; }
  adaptTimer += rawDt; if (adaptTimer > 2.5) { adaptTimer = 0; if (fpsEMA < 45 && quality < 2) { quality++; applyQuality(); } }

    var t = trail[i], age = now / 1000 - t.t, lifeF = 1 - age / 0.35;

    t.m.visible = true; t.m.position.copy(t.p); var sc = 0.5 + lifeF * 0.6; t.m.scale.set(sc, sc, sc); t.m.material.opacity = lifeF * lifeF * 0.35 * strength;
  }

  var anyP = false;
  for (var pi2 = 0; pi2 < P_MAX; pi2++) {
    if (pAge[pi2] >= pLife[pi2]) {
      pMesh.setMatrixAt(pi2, pDummy.matrix);
      sparkGlowPos[pi2*3] = 0;
      sparkGlowPos[pi2*3+1] = -50;
      sparkGlowPos[pi2*3+2] = 0;
      sparkGlowSize[pi2] = 0;
      continue;
    }

    pAge[pi2] += dt;

    var lf = THREE.MathUtils.clamp(1 - pAge[pi2] / pLife[pi2], 0, 1);
    var fade = lf * lf * (3 - 2 * lf);

    pVel[pi2*3+1] -= GRAV * (0.28 + pSeed[pi2] * 0.12) * dt;
    var pDrag = Math.max(0, 1 - (1.25 + pSeed[pi2] * 1.4) * dt);
    pVel[pi2*3] *= pDrag;
    pVel[pi2*3+1] *= pDrag;
    pVel[pi2*3+2] *= pDrag;

    pPos[pi2*3] += pVel[pi2*3] * dt;
    pPos[pi2*3+1] += pVel[pi2*3+1] * dt;
    pPos[pi2*3+2] += pVel[pi2*3+2] * dt;

    if (pPos[pi2*3+1] < 0.055) {

        pVel[pi2*3+1] = -pVel[pi2*3+1] * (0.22 + pSeed[pi2] * 0.16);

        pVel[pi2*3+2] *= 0.72;

        pVel[pi2*3+1] = 0;
        pVel[pi2*3] *= 0.88;
        pVel[pi2*3+2] *= 0.88;

    var px = pPos[pi2*3], pz = pPos[pi2*3+2];
    if (px > WALL.x - WALL.hx - 0.025 && px < WALL.x + WALL.hx + 0.025 &&
        pz > -WALL.hz && pz < WALL.hz && pPos[pi2*3+1] < WALL.h + 0.08) {
      var side = px < WALL.x ? -1 : 1;
      pPos[pi2*3] = WALL.x + side * (WALL.hx + 0.03);
      if (pVel[pi2*3] * side < 0) pVel[pi2*3] = -pVel[pi2*3] * 0.35;
    }

    pRot[pi2*3] += pRotV[pi2*3] * dt;
    pRot[pi2*3+1] += pRotV[pi2*3+1] * dt;
    pRot[pi2*3+2] += pRotV[pi2*3+2] * dt;

    /* Elongate fast sparks along their velocity for a subtle streak. */
    var vx = pVel[pi2*3], vy = pVel[pi2*3+1], vz = pVel[pi2*3+2];
    var vlen = Math.sqrt(vx*vx + vy*vy + vz*vz);
    tmpV1.set(px, pPos[pi2*3+1], pz);
    tmpV2.set(vx, vy, vz);

    particleEuler.set(
      pRot[pi2*3],
      pRot[pi2*3+1],
      pRot[pi2*3+2]
    );
    tmpQ1.setFromEuler(particleEuler);

    var pulse = 0.78 + 0.22 * Math.sin(pAge[pi2] * 28 + pSeed[pi2] * 12);
    var baseScale = pScale[pi2] * (0.42 + 0.58 * fade) * pulse;
    var stretch = 1 + Math.min(2.8, vlen * 0.055) * fade;

    tmpV3.set(baseScale * 0.82, baseScale * stretch, baseScale * 0.82);
    particleMat.compose(tmpV1, tmpQ1, tmpV3);
    pMesh.setMatrixAt(pi2, particleMat);

    sparkGlowPos[pi2*3] = px;
    sparkGlowPos[pi2*3+1] = pPos[pi2*3+1];
    sparkGlowPos[pi2*3+2] = pz;
    sparkGlowSize[pi2] = (3.5 + vlen * 0.75) * fade;
  }

  if (anyP || flags.fx) {
    pMesh.instanceMatrix.needsUpdate = true;
    sparkGlowGeo.attributes.position.needsUpdate = true;
    sparkGlowGeo.attributes.aSize.needsUpdate = true;
  }

  for (var f2 = 0; f2 < flashLights.length; f2++) { var fo = flashLights[f2]; fo.i *= Math.exp(-9 * rawDt); fo.l.intensity = fo.i; }
  dustMat.uniforms.uTime.value += dt;
  camUpdate(rawDt);

  statTimer += rawDt;
  if (statTimer > 0.2) {
    statTimer = 0; sVel.textContent = speed.toFixed(1); sHgt.textContent = h.toFixed(1);
    sEn.textContent = Math.round(0.5 * speed * speed + GRAV * h); sFps.textContent = Math.round(fpsEMA);
  }

  // Multilayer Rendering setup
  renderer.clear();
  renderer.render(scene, camera);
  renderer.clearDepth();
  renderer.render(hudScene, hudCamera);
}

/* ============================================================
   12. BOOT
============================================================ */
onResize(); applyQuality();

if (window.AssetsManager) AssetsManager.init(scene);

requestAnimationFrame(function (t) {
  lastT = t; document.getElementById('loader').style.opacity = 0;
  setTimeout(function () { var l = document.getElementById('loader'); if (l && l.parentNode) l.parentNode.removeChild(l); }, 700);
  setTimeout(function () { document.getElementById('hint').style.opacity = 0; }, 8000);
  requestAnimationFrame(loop);
});

})();
    </script>
